open_vocab_place_executor:
  ros__parameters:
    # ==================== Pick evidence / grasp geometry ====================
    grasp_plan_json_path: "/opt/open-vocabulary-robot-rearrangement/perception/grasp_plans/latest_grasp_plan.json"
    pick_history_jsonl_path: "/opt/open-vocabulary-robot-rearrangement/perception/manipulation_logs/pick_execution_history.jsonl"
    max_pick_age_s: 3600.0
    require_recent_pick_evidence: true

    # ==================== Destination global perception ====================
    # Change this to "organizer box" / "storage box" for medicine-box demo.
    destination_query: "glass bowl"
    ai_service_base_url: "http://ai-server.local:8090"
    homography_npy_path: "/opt/open-vocabulary-robot-rearrangement/perception/calibration/H_image_to_base.npy"
    expected_image_space_id: "UNDISTORTED_1280x720"
    expected_width: 1280
    expected_height: 720
    ai_connect_timeout_s: 2.0
    ai_read_timeout_s: 20.0
    destination_min_confidence: 0.45
    destination_min_mask_area_px: 300
    destination_reject_ambiguous: true
    destination_ambiguity_margin: 0.08
    max_destination_age_s: 120.0

    # Optional XY correction if the receptacle mask centroid is systematically biased.
    destination_xy_offset_x_m: 0.0
    destination_xy_offset_y_m: -0.05

    # Original development-environment work area; measure locally and synchronize
    # with the table CollisionObject before real execution.
    workspace_x_min_m: 0.12
    workspace_x_max_m: 0.88
    workspace_y_min_m: -0.40
    workspace_y_max_m: 0.40

    latest_destination_json_path: "/opt/open-vocabulary-robot-rearrangement/perception/place_outputs/latest_destination.json"
    latest_place_plan_json_path: "/opt/open-vocabulary-robot-rearrangement/perception/place_outputs/latest_place_plan.json"

    # ==================== Receptacle geometry ====================
    # IMPORTANT: measure from physical tabletop to the rim top with a ruler.
    # Keep -1.0 until measured; /place/prepare will refuse to move with an unset value.
    # This value is an original development-environment example, not a new calibration.
    destination_rim_height_m: 0.090

    # The grasp-center point (roughly where the fingers hold the object) is released
    # this far ABOVE the container rim.  This intentionally drops into the bowl/box
    # rather than inserting the fingers into a transparent receptacle.
    release_grasp_center_above_rim_m: 0.060

    # Preplace is directly above release with the same EEF orientation.
    preplace_clearance_m: 0.100

    # V8 robust IK search: preserve the successful grasp tilt, but allow the
    # held object / wrist to yaw about base Z.  This does NOT change where the
    # grasp center is released; the EEF->grasp-center offset is rotated together.
    place_yaw_search_deg: [0.0, -30.0, 30.0, -60.0, 60.0, -90.0, 90.0, 180.0]
    preplace_clearance_candidates_m: [0.100, 0.080, 0.120]
    place_candidate_yaw_penalty_rad_per_deg: 0.020

    min_release_grasp_center_above_table_m: 0.050
    max_place_goal_z_m: 0.80

    # ==================== MoveIt / Kinova ====================
    base_frame: "base_link"
    planning_group: "manipulator"
    goal_link: "end_effector_link"
    joint_states_topic: "/joint_states"
    arm_joint_names:
      - "joint_1"
      - "joint_2"
      - "joint_3"
      - "joint_4"
      - "joint_5"
      - "joint_6"
      - "joint_7"

    compute_ik_service: "/compute_ik"
    motion_plan_service: "/plan_kinematic_path"
    cartesian_path_service: "/compute_cartesian_path"
    get_planning_scene_service: "/get_planning_scene"
    state_validity_service: "/check_state_validity"
    execute_trajectory_action: "/execute_trajectory"
    trajectory_execution_event_topic: "/trajectory_execution_event"
    require_state_validity_service: true
    table_object_id: "grasp_table"

    planner_id: "RRTConnectkConfigDefault"
    planning_attempts: 3
    allowed_planning_time_s: 4.0
    ik_timeout_s: 0.35
    velocity_scaling: 0.06
    acceleration_scaling: 0.05
    cartesian_velocity_scaling: 0.025
    cartesian_acceleration_scaling: 0.025
    cartesian_max_step_m: 0.003
    cartesian_jump_threshold: 0.0
    min_cartesian_fraction: 0.995
    max_single_joint_delta_rad: 2.80
    max_joint_l1_delta_rad: 8.50
    max_joint_state_age_s: 0.25
    execution_timeout_s: 60.0

    # ==================== HARD EXECUTION LOCKS ====================
    # First run locate+prepare with both false and inspect RViz markers.
    enable_place_arm_execution: false
    enable_release_execution: false

    # ==================== Gripper ====================
    gripper_action: "/robotiq_gripper_controller/gripper_cmd"
    gripper_open_position: 0.0
    gripper_max_effort: 40.0
    gripper_timeout_s: 8.0
    release_dwell_s: 0.50

    # ==================== Execution verification ====================
    preplace_position_tolerance_m: 0.020
    release_position_tolerance_m: 0.015
    orientation_tolerance_deg: 12.0

    # Optional coarse post-place global-RGB verification.
    # It checks source centroid distance from destination centroid, not mask containment.
    verify_acceptance_radius_m: 0.14
    verify_source_query: ""

    # ==================== Audit / RViz ====================
    status_topic: "/open_vocab/place/status"
    marker_topic: "/open_vocab/place/markers"
    latest_place_execution_json_path: "/opt/open-vocabulary-robot-rearrangement/perception/manipulation_logs/latest_place_execution.json"
    place_execution_history_jsonl_path: "/opt/open-vocabulary-robot-rearrangement/perception/manipulation_logs/place_execution_history.jsonl"
