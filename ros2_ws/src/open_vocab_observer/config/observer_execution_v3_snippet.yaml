# Add this under open_vocab_moveit_observer.ros__parameters
planning_group: observation_arm
base_frame: base_link
goal_link: spherical_wrist_2_link

# Real Kinova arm controller joint set.
# observation_arm plans joint_1..joint_6; execution code holds joint_7 constant
# and sends a complete 7-joint trajectory to the controller.
execution_joint_names:
  - joint_1
  - joint_2
  - joint_3
  - joint_4
  - joint_5
  - joint_6
  - joint_7

# Keep false for the first test after replacing the C++ file.
execute_motion: false
